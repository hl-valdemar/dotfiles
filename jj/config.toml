#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Valdemar Lorenzen"
email = "valdemar.lorenzen@jepp.com"

[ui]
pager = ["bash", "-c", """
if [[ "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" == "Dark" ]]; then
  export BAT_THEME="Miasma Dark"
  export DELTA_FEATURES="dark-mode"
else
  export BAT_THEME="Miasma Light"
  export DELTA_FEATURES="light-mode"
fi
DELTA_SIDE_BY_SIDE=""
if [ "$(tput cols)" -ge 160 ]; then
  DELTA_SIDE_BY_SIDE="--side-by-side"
fi
exec delta --paging=always --line-numbers $DELTA_SIDE_BY_SIDE
"""]
diff-formatter = "delta-diff"
editor = "nvim"
merge-editor = "diffconflicts"

[merge-tools.delta-diff]
diff-args = ["diff", "--no-index", "--color=always", "$left", "$right"]
program = "git"
diff-expected-exit-codes = [0, 1]

[merge-tools.diffconflicts]
program = "nvim"
merge-args = [
    "-c", "let g:jj_diffconflicts_marker_length=$marker_length",
    "-c", "JJDiffConflicts!", "$output", "$base", "$left", "$right",
]
merge-tool-edits-conflict-markers = true

[colors]

[git.ssh]
hijack-askpass = true
#"diff token" = { underline = false }

